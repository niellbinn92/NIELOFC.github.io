<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIELofc - Toko Cheat</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Saira:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--biru:#2563EB;--biru-glow:#3B82F6;--hitam:#050A14;--abu:#0F172A;}
body{background:var(--hitam);color:#fff;font-family:'Saira', sans-serif;}
h1, h2, h3,.font-black{font-family:'Rajdhani', sans-serif;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:var(--biru-glow)}
.glow-text{text-shadow:0 0 5px var(--biru-glow);animation: glow 2.5s ease-in-out infinite alternate;}
@keyframes glow {from { opacity: 0.7; } to { opacity: 1; text-shadow:0 0 15px var(--biru-glow); }}
.header{position:sticky;top:0;z-index:50;background:#000;border-bottom:2px solid var(--biru)}
.banner{position:relative;height:200px;overflow:hidden;border-radius:0 0 16px 16px;border-bottom:2px solid var(--biru);background:#000}
.banner img{position:absolute;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1s ease-in-out}
.banner img.active{opacity:1}
.card{background:var(--abu);border-radius:16px;transition:0.2s;border:1px solid var(--biru);padding:8px;cursor:pointer}
.card:active{transform:scale(0.96);border-color:var(--biru-glow)}
.card img{width:100%;height:120px;object-fit:cover;border-radius:12px;margin-bottom:8px;border:1px solid var(--biru)}
.page{display:none}.page.active{display:block}
.durasi-btn{border:1px solid var(--biru);padding:12px;border-radius:10px;cursor:pointer;text-align:center;font-weight:700;background:var(--abu)}
.durasi-btn.active{border-color:var(--biru-glow);background:#2563EB30;box-shadow:0 0 8px var(--biru-glow)}
.durasi-btn.disabled{opacity:0.4;cursor:not-allowed;background:#EF444430;border-color:#EF4444}
.filter-btn{background:var(--abu);padding:8px 18px;border-radius:20px;font-size:13px;font-weight:800;white-space:nowrap;border:1px solid var(--biru);cursor:pointer}
.filter-btn.active{background:var(--biru);color:#fff;box-shadow:0 0 8px var(--biru-glow)}
.input{width:100%;background:var(--abu);padding:12px;border-radius:10px;border:1px solid var(--biru);color:#fff}
.menu-btn{background:none;border:none;color:var(--biru-glow);font-size:24px;cursor:pointer;font-weight:900}
.side-menu{position:fixed;top:0;right:-300px;width:280px;height:100%;background:#000;border-left:2px solid var(--biru);z-index:100;transition:0.3s;padding:20px;display:flex;flex-direction:column;gap:10px}
.side-menu.active{right:0}
.side-menu a{padding:14px;border-radius:10px;background:var(--abu);font-weight:800;text-align:center;border:1px solid var(--biru);cursor:pointer}
.side-menu a:hover{background:var(--biru)}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#00080;z-index:99;display:none}
.overlay.active{display:block}
.stok-habis{color:#EF4444;font-size:11px;font-weight:800}
.loading{text-align:center;padding:40px;color:var(--biru-glow)}
.dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#2563EB50;transition:0.3s}
.dot.active{background:var(--biru-glow)}
</style>
</head>
<body>

<div class="header p-3 flex justify-between items-center">
  <div>
    <h1 class="text-2xl font-black glow-text">NIEL<span class="text-cyan-400">ofc</span></h1>
  </div>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
</div>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>
<div id="sideMenu" class="side-menu">
  <h3 class="text-xl font-bold mb-2 text-center">MENU</h3>
  <a onclick="showPage('home');toggleMenu()">Home</a>
  <a onclick="showPage('faq');toggleMenu()">FAQ</a>
  <a href="https://wa.me/6285194336082" target="_blank">CS WhatsApp</a>
</div>

<div id="home" class="page active">
  <div class="banner">
    <img src="https://i.ibb.co.com/bMC635bG/F801-F624-F654-4-C43-9-F6-A-DC4416894-BA5.png" class="active">
    <img src="https://i.ibb.co.com/d0Jb0TbJ/AB94-CFF3-E55-A-44-AB-8-CDE-D334337-B5-A92.png">
    <img src="https://i.ibb.co.com/Gvfn9RBm/2-F44-B3-A4-A822-46-A8-B171-62-BABD63-AA2-D.png">
    <div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
  <div class="p-3 flex gap-2 overflow-x-auto">
    <button id="btn-semua" class="filter-btn active" onclick="filterProduk('semua')">SEMUA</button>
    <button id="btn-freefire" class="filter-btn" onclick="filterProduk('freefire')">FREE FIRE</button>
    <button id="btn-pubg" class="filter-btn" onclick="filterProduk('pubg')">PUBG</button>
    <button id="btn-8ball" class="filter-btn" onclick="filterProduk('8ball')">8 BALL</button>
    <button id="btn-sertifikat" class="filter-btn" onclick="filterProduk('sertifikat')">SERTIFIKAT IOS</button>
  </div>
  <h3 class="px-3 font-bold text-lg italic">Produk</h3>
  <div id="produkGrid" class="grid grid-cols-2 gap-3 p-3 pb-10"><div class="loading col-span-2">⏳ Loading produk...</div></div>
</div>

<div id="detail" class="page">
  <div class="p-3 flex items-center gap-2 cursor-pointer" onclick="showPage('home')">← <b>KEMBALI</b></div>
  <div class="p-3 pb-10">
    <img id="detailImg" class="w-full h-48 object-cover bg-black rounded-2xl border-blue-500">
    <h2 id="detailNama" class="text-2xl font-bold mt-2 italic"></h2>
    <p id="detailGame" class="text-cyan-400 text-sm font-bold"></p>
    <div class="mt-3"><label class="text-sm font-bold">1. NO WHATSAPP AKTIF</label><input id="nohp" type="number" placeholder="0812xxxx" class="input mt-1"></div>
    <div class="mt-3"><label class="text-sm font-bold">2. PILIH DURASI</label><div id="durasiGrid" class="grid grid-cols-2 gap-2 mt-1"></div></div>
    <button onclick="orderWA()" class="w-full bg-green-500 py-3 rounded mt-4 font-bold">ORDER VIA WHATSAPP</button>
  </div>
</div>

<div id="faq" class="page"><div class="p-4 pb-10"><h2 class="text-2xl font-bold mb-4 italic">FAQ</h2><p>Isi FAQ disini</p></div></div>

<script>
const SHEET_URL = "https://sheetdb.io/api/v1/nic3xbjpcwkqq";
let produk = {};
let produkAktif = ""; let durasiAktif = {};
const NO_WA = "6285194336082";

function toggleMenu(){ document.getElementById('sideMenu').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function filterProduk(kategori){ document.querySelectorAll('.filter-btn').forEach(btn=>btn.classList.remove('active')); document.getElementById('btn-'+kategori).classList.add('active'); renderProduk(kategori); }
function pilihDurasi(el, i){ if(el.classList.contains('disabled')) return; document.querySelectorAll('.durasi-btn').forEach(e=>e.classList.remove('active')); el.classList.add('active'); durasiAktif = produk[produkAktif].durasi[i]; }
function renderProduk(kategori = 'semua'){
  const grid = document.getElementById('produkGrid'); grid.innerHTML = "";
  for(let key in produk){
    if(kategori == 'semua' || produk[key].kategori == kategori){
      grid.innerHTML += `<div class="card" onclick="showProduct('${key}')"><img src="${produk[key].img}"><p class="text-base font-bold italic">${produk[key].nama}</p><p class="text-xs text-gray-400">${produk[key].game}</p></div>`;
    }
  }
}
function showProduct(key){ produkAktif = key; const p = produk[key]; document.getElementById('detailImg').src = p.img; document.getElementById('detailNama').innerText = p.nama; document.getElementById('detailGame').innerText = p.game; let grid = ""; p.durasi.forEach((d,i)=>{ if(d.harga == "habis"){ grid += `<div class="durasi-btn disabled">${d.label}<br><b class="stok-habis">STOK HABIS</b></div>`; } else { grid += `<div class="durasi-btn" onclick="pilihDurasi(this, ${i})">${d.label}<br><b>Rp${d.harga.toLocaleString('id')}</b></div>`; } }); document.getElementById('durasiGrid').innerHTML = grid; durasiAktif = {}; showPage('detail'); }

async function orderWA(){
  const nohp = document.getElementById('nohp').value;
  if(!nohp || nohp.length < 10){ alert('Isi No WA yang bener!'); return; }
  if(!durasiAktif.label){ alert('Pilih Durasi dulu!'); return; }
  let pesan = `Halo Admin NIELofc%0AProduk: ${produk[produkAktif].nama}%0ADurasi: ${durasiAktif.label}%0ANo WA: ${nohp}`;
  window.open(`https://wa.me/${NO_WA}?text=${pesan}`, '_blank');
}

async function loadProdukDariSheet() {
  try {
    let res = await fetch(SHEET_URL); let rows = await res.json(); produk = {};
    rows.forEach(row => {
      let nama = row.Produk; let durasi = row.Durasi; let harga = row.Harga; let stok = row.Stok;
      let kategori = row.Kategori || "freefire"; let gambar = row.Gambar || "https://i.ibb.co.com/fdSbRZws/D59-B08-CC-71-D9-4-CAC-9-A24-68-F271078-F7-B.png";
      let keyProduk = nama.toLowerCase().replace(/ /g, "");
      if(!produk[keyProduk]){ produk[keyProduk] = {nama: nama, img: gambar, kategori: kategori.toLowerCase(), game: kategori.toUpperCase(), desc: "Produk digital", durasi: []} }
      produk[keyProduk].durasi.push({label: durasi, harga: parseInt(stok) === 0? "habis" : parseInt(harga)})
    });
    renderProduk('semua');
  } catch(err){ document.getElementById('produkGrid').innerHTML = '<p class="col-span-2 text-center text-red-400">Error: Cek sheetdb.io</p>'; }
}

let slideIndex = 0; function showSlide(){ const slides = document.querySelectorAll('.banner img'); const dots = document.querySelectorAll('.dot'); if(slides.length==0)return; slides.forEach(s=>s.classList.remove('active')); dots.forEach(d=>d.classList.remove('active')); slideIndex = (slideIndex + 1) % slides.length; slides[slideIndex].classList.add('active'); dots[slideIndex].classList.add('active'); } setInterval(showSlide, 3000);

window.onload = function(){ loadProdukDariSheet(); };
</script>
</body>
</html>
