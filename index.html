<!DOCTYPE html>

<html lang="id">

<head>

  <meta charset="UTF-8">

<meta
 name="viewport"
 content="width=device-width, initial-scale=1.0">

<meta
 name="description"
 content="NIELSTORE — Gaming Store">

  <title>NIELSTORE — Gaming Store</title>

  <!-- FONT -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="style.css">

</head>

<body>

  <!-- =====================================================
       LOADING SCREEN
       LANGSUNG HIDDEN AGAR WEBSITE TIDAK NYANGKUT
  ====================================================== -->

  <div
    id="loadingScreen"
    class="loading-overlay hidden"
    style="display:none !important;">

```
<div class="spinner"></div>

<p class="loading-text">
  Memuat NIELSTORE...
</p>
```

  </div>

  <!-- =====================================================
       MAIN APP
  ====================================================== -->

  <div id="mainApp">

```
<!-- ===================================================
     NAVBAR
==================================================== -->

<nav class="navbar">

  <div class="nav-inner">


    <!-- LOGO -->

    <div class="logo">
      NIEL<span>STORE</span>
    </div>


    <!-- MENU -->

    <div class="nav-links">

      <a
        href="#"
        class="active"
        onclick="
          showCatalog();
          return false;
        ">
        Home
      </a>


      <a
        href="#produk"
        onclick="
          showCatalog();
          return false;
        ">
        Produk
      </a>


      <a
        href="#"
        onclick="
          showOrders();
          return false;
        ">
        Cek Pesanan
      </a>

    </div>

  </div>

</nav>



<!-- ===================================================
     CATALOG
==================================================== -->

<main id="catalogView">


  <div class="container">


    <!-- FILTER -->

    <div class="filter-tabs">


      <button
        class="tab active"
        data-filter="all"
        onclick="
          filterProducts('all');
        ">

        Semua

      </button>


      <button
        class="tab"
        data-filter="android"
        onclick="
          filterProducts('android');
        ">

        Android

      </button>


      <button
        class="tab"
        data-filter="ios"
        onclick="
          filterProducts('ios');
        ">

        iOS

      </button>


    </div>



    <!-- PRODUCT GRID -->

    <div
      id="productGrid"
      class="product-grid">

      <!-- Produk dimuat oleh script.js -->

    </div>



    <!-- SHEET STATUS -->

    <div
      id="sheetStatus"
      style="
        text-align:center;
        margin:15px 0;
        font-size:.82rem;
        color:var(--text-muted);
      ">
    </div>


  </div>

</main>



<!-- ===================================================
     PRODUCT DETAIL
==================================================== -->

<main
  id="detailView"
  class="hidden">


  <div class="container detail-container">


    <!-- BACK -->

    <button
      class="back-btn"
      onclick="showCatalog()">

      ← Kembali

    </button>



    <!-- DETAIL LAYOUT -->

    <div class="detail-layout">


      <!-- ================= LEFT ================= -->

      <div class="detail-left">


        <!-- IMAGE -->

        <div
          class="detail-image"
          id="detailImage">
        </div>



        <!-- NAME -->

        <h1
          class="detail-name"
          id="detailName">
        </h1>



        <!-- META -->

        <div class="detail-meta">


          <span
            class="platform-badge"
            id="detailPlatform">
          </span>


          <span
            class="rating"
            id="detailRating">
          </span>


        </div>



        <!-- DESCRIPTION -->

        <div class="detail-desc">


          <h3>
            DESKRIPSI PRODUK
          </h3>


          <ul
            id="detailDesc">
          </ul>


        </div>


      </div>



      <!-- ================= RIGHT ================= -->

      <div class="detail-right">


        <div class="order-box">


          <!-- ================= VOUCHER ================= -->

          <div class="order-section">


            <div class="section-title">


              <span class="num">
                1
              </span>


              PILIH NOMINAL VOUCHER


            </div>



            <div
              id="voucherGrid"
              class="voucher-grid">
            </div>


          </div>



          <!-- ================= PAYMENT ================= -->

          <div class="order-section">


            <div class="section-title">


              <span class="num">
                2
              </span>


              PEMBAYARAN


            </div>



            <div
              class="payment-option selected">


              <div class="pay-left">


                <span class="pay-icon">
                  ⚡
                </span>


                <div>


                  <strong>
                    QRIS
                  </strong>


                  <small>
                    All Payment
                  </small>


                </div>


              </div>



              <div class="pay-check">
                ✓
              </div>


            </div>



            <div class="payment-sub">


              <span>
                Pembayaran otomatis via AutoGoPay
              </span>


              <span class="gratis">

                Admin:

                <b>
                  GRATIS
                </b>

              </span>


            </div>


          </div>



          <!-- ================= BUY ================= -->

          <button
            id="btnOrder"
            class="btn-buy-now"
            onclick="processOrder()">

            Beli Sekarang

          </button>


        </div>


      </div>


    </div>


  </div>


</main>



<!-- ===================================================
     MODAL
==================================================== -->

<div
  id="successModal"
  class="modal-overlay">
</div>
```

  </div>

       JAVASCRIPT

  <script src="script.js"></script>

</body>

</html>
