<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIELofc - Sedang Maintenance</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #07070F;
    color: #F1F0FF;
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* Background glow */
  body::before {
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(124,58,237,0.25) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
  }

  /* Spinner */
  .spinner-wrap {
    position: relative;
    width: 80px;
    height: 80px;
    margin: 0 auto 32px;
  }
  .spinner {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top: 3px solid #A855F7;
    border-right: 3px solid #7C3AED;
    animation: spin 1.1s linear infinite;
  }
  .spinner-inner {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 3px solid transparent;
    border-bottom: 3px solid #C084FC;
    animation: spin 0.8s linear infinite reverse;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  h1 {
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 16px;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #C084FC, #A855F7, #7C3AED);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p {
    font-size: 15px;
    color: #9CA3AF;
    line-height: 1.7;
    max-width: 360px;
    margin: 0 auto 36px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, #7C3AED, #A855F7);
    color: white;
    font-weight: 700;
    font-size: 14px;
    padding: 14px 32px;
    border-radius: 50px;
    text-decoration: none;
    box-shadow: 0 8px 30px rgba(124, 58, 237, 0.4);
    transition: all 0.25s ease;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 35px rgba(124, 58, 237, 0.55);
  }
  .btn .dot {
    width: 8px;
    height: 8px;
    background: #4ADE80;
    border-radius: 50%;
    box-shadow: 0 0 8px #4ADE80;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .footer {
    position: absolute;
    bottom: 28px;
    font-size: 12px;
    color: #6B7280;
    z-index: 1;
  }
  .footer span {
    color: #A855F7;
    font-weight: 600;
  }
</style>
</head>
<body>

  <div class="content">
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <div class="spinner-inner"></div>
    </div>

    <h1>Sedang Maintenance</h1>

    <p>
      Kami sedang melakukan pemeliharaan sistem<br>
      untuk pengalaman yang lebih baik.<br>
      Mohon bersabar — kami akan segera kembali!
    </p>

    <a href="https://wa.me/6285194336082" class="btn">
      <span class="dot"></span>
      AKAN SEGERA KEMBALI
    </a>
  </div>

  <div class="footer">
    © 2026 <span>NIELofc</span> — Premium Panel
  </div>

</body>
</html>
