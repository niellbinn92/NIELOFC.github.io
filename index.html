<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIELofc - Toko Cheat</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--biru:#2563EB;--hitam:#050A14;--abu:#0F172A;}
body{background:var(--hitam);color:#fff;font-family:sans-serif;}
.header{background:#000;border-bottom:2px solid var(--biru);padding:12px}
.card{background:var(--abu);border:1px solid var(--biru);border-radius:12px;padding:8px}
.card img{width:100%;height:120px;object-fit:cover;border-radius:8px;margin-bottom:8px}
</style>
</head>
<body>

<div class="header">
  <h1 class="text-2xl font-bold text-blue-500">NIELofc STORE</h1>
</div>

<div class="p-3">
  <h3 class="font-bold text-lg mb-2">Produk</h3>
  <div id="produkGrid" class="grid grid-cols-2 gap-3"></div>
</div>

<script>
const NO_WA = "6285194336082";

// ISI PRODUK LANGSUNG DISINI. GA PAKE SHEETDB LAGI
const produk = [
  {nama: "Fluorite IOS FF", game: "FREE FIRE", img: "https://i.ibb.co/fdSbRZws/D59-B08-CC-71-D9-4-CAC-9-A24-68-F271078-F7-B.png", durasi: [{label:"1 Hari", harga:15000}, {label:"7 Hari", harga:50000}]},
  {nama: "Migul IOS", game: "FREE FIRE", img: "https://i.ibb.co/fdSbRZws/D59-B08-CC-71-D9-4-CAC-9-A24-68-F271078-F7-B.png", durasi: [{label:"1 Hari", harga:20000}]},
  {nama: "BR Mods PC", game: "PUBG", img: "https://i.ibb.co/fdSbRZws/D59-B08-CC-71-D9-4-CAC-9-A24-68-F271078-F7-B.png", durasi: [{label:"30 Hari", harga:100000}]},
  {nama: "Reaper X Pro", game: "ANDROID", img: "https://i.ibb.co/fdSbRZws/D59-B08-CC-71-D9-4-CAC-9-A24-68-F271078-F7-B.png", durasi: [{label:"1 Hari", harga:10000}, {label:"Stok Habis", harga:"habis"}]},
];

function renderProduk(){
  const grid = document.getElementById('produkGrid'); grid.innerHTML = "";
  produk.forEach((p, i)=>{
    grid.innerHTML += `<div class="card" onclick="order('${p.nama}')"><img src="${p.img}"><p class="font-bold">${p.nama}</p><p class="text-xs text-gray-400">${p.game}</p></div>`;
  })
}

function order(nama){
  let pesan = `Halo Admin NIELofc%0ASaya mau order: ${nama}`;
  window.open(`https://wa.me/${NO_WA}?text=${pesan}`, '_blank');
}

renderProduk(); // langsung jalan, ga nunggu
</script>
</body>
</html>
