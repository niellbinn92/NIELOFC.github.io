<!-- NAVBAR -->

<nav class="navbar">

  <div class="nav-inner">

    <div class="logo">
      NIEL<span>STORE</span>
    </div>

    <div class="nav-links">

      <a
        href="#"
        class="active"
        onclick="showCatalog(); return false;">
        Home
      </a>

      <a
        href="#"
        onclick="showCatalog(); return false;">
        Produk
      </a>

      <a href="#">
        Cek Pesanan
      </a>

    </div>

  </div>

</nav>


<!-- =========================
     CATALOG
========================== -->

<main id="catalogView">

  <div class="container">

    <div class="filter-tabs">

      <button
        class="tab active"
        data-filter="all"
        onclick="filterProducts('all')">
        Semua
      </button>

      <button
        class="tab"
        data-filter="android"
        onclick="filterProducts('android')">
        Android
      </button>

      <button
        class="tab"
        data-filter="ios"
        onclick="filterProducts('ios')">
        iOS
      </button>

    </div>


    <div
      class="product-grid"
      id="productGrid">
    </div>

  </div>

</main>


<!-- =========================
     PRODUCT DETAIL
========================== -->

<main
  id="detailView"
  class="hidden">

  <div class="container detail-container">

    <button
      class="back-btn"
      onclick="showCatalog()">
      ← Kembali
    </button>


    <div class="detail-layout">

      <!-- LEFT -->

      <div class="detail-left">

        <div
          class="detail-image"
          id="detailImage">
        </div>


        <h1
          class="detail-name"
          id="detailName">
        </h1>


        <div class="detail-meta">

          <span
            class="platform-badge"
            id="detailPlatform">
          </span>

          <span
            class="rating"
            id="detailRating">
          </span>

        </div>


        <div class="detail-desc">

          <h3>
            DESKRIPSI PRODUK
          </h3>

          <ul id="detailDesc"></ul>

        </div>

      </div>


      <!-- RIGHT -->

      <div class="detail-right">

        <div class="order-box">


          <!-- VOUCHER -->

          <div class="order-section">

            <div class="section-title">

              <span class="num">
                1
              </span>

              PILIH NOMINAL VOUCHER

            </div>


            <div
              class="voucher-grid"
              id="voucherGrid">
            </div>

          </div>


          <!-- PAYMENT -->

          <div class="order-section">

            <div class="section-title">

              <span class="num">
                2
              </span>

              PEMBAYARAN

            </div>


            <div class="payment-option selected">

              <div class="pay-left">

                <span class="pay-icon">
                  ⚡
                </span>

                <div>

                  <strong>
                    QRIS
                  </strong>

                  <small>
                    All Payment
                  </small>

                </div>

              </div>


              <div class="pay-check">
                ✓
              </div>

            </div>


            <div class="payment-sub">

              <span>
                Pembayaran otomatis via AutoGoPay
              </span>

              <span class="gratis">
                Admin:
                <b>GRATIS</b>
              </span>

            </div>

          </div>


          <!-- BUY BUTTON -->

          <button
            class="btn-buy-now"
            id="btnOrder"
            onclick="processOrder()">

            Beli Sekarang

          </button>

        </div>

      </div>

    </div>

  </div>

</main>


<!-- =========================
     MODAL
========================== -->

<div
  class="modal-overlay"
  id="successModal">
</div>

</html>
